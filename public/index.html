<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>正和 Agent 直播 · zhenghe-live</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
             margin: 0; background: #0f1115; color: #e7e9ee; }
      header { padding: 16px 20px; background: #161a22; border-bottom: 1px solid #232838; }
      header h1 { margin: 0; font-size: 18px; }
      header p { margin: 4px 0 0; font-size: 13px; color: #9aa3b2; }
      main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px; }
      @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
      .card { background: #161a22; border: 1px solid #232838; border-radius: 12px; padding: 14px; }
      .room { display: flex; justify-content: space-between; align-items: center;
              padding: 10px; border: 1px solid #232838; border-radius: 10px; margin-bottom: 8px; }
      .room small { color: #9aa3b2; }
      button { cursor: pointer; border: 0; border-radius: 8px; padding: 8px 12px;
               background: #3b82f6; color: #fff; font-size: 13px; }
      button.ghost { background: #232838; color: #e7e9ee; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      #video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; margin-top: 12px; }
      input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #232838;
              background: #0f1115; color: #e7e9ee; margin-top: 6px; }
      #log { font-family: ui-monospace, monospace; font-size: 12px; color: #9aa3b2;
             white-space: pre-wrap; max-height: 180px; overflow: auto; margin-top: 10px; }
      .tag { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: #1f6feb33; color: #7ab0ff; }
    </style>
  </head>
  <body>
    <header>
      <h1>正和 Agent 直播 · zhenghe-live</h1>
      <p>架在 Agent 市场之上的 live 服务场景 · 每次消费走 router.pay → LoveVault → NAV↑（正和）</p>
    </header>
    <main>
      <section class="card">
        <h3>发现 · 直播间</h3>
        <div id="rooms"></div>
        <hr style="border-color:#232838" />
        <h3>进房</h3>
        <input id="room" placeholder="直播间 ID (liveId)" value="demo-live-001" />
        <input id="identity" placeholder="你的身份 (地址或昵称)" value="audience-1" />
        <div class="actions">
          <button id="join">进入直播间</button>
          <button class="ghost" id="leave">离开</button>
        </div>
      </section>
      <section class="card">
        <h3>课堂</h3>
        <video id="video" autoplay playsinline></video>
        <div class="actions">
          <button data-action="seat" data-usdc="0.02">进房席位 0.02</button>
          <button data-action="ask" data-usdc="0.05">向主播提问 0.05</button>
          <button data-action="replay" data-usdc="0.03">看回放 0.03</button>
          <button data-action="tip" data-usdc="0.10">打赏 0.10</button>
        </div>
        <div id="log"></div>
        <p style="font-size:12px;color:#9aa3b2">
          消费需浏览器钱包（如 MetaMask，Base 主网）。点击后先授权 USDC 给 router，再提交 router.pay。
          主播收到 USDC，0.3% 注 LoveVault 推高 NAV。生产环境改用 x402 facilitator 自动完成。
        </p>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
